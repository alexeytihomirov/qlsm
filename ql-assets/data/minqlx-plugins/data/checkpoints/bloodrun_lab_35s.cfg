qlx restorecp player 0 score 2
qlx restorecp player 0 active weapon lg
qlx restorecp player 0 weapon rl
qlx restorecp player 0 weapon lg
qlx restorecp player 0 weapon rg
qlx restorecp player 0 weapon pg
qlx restorecp player 0 weapon bfg
qlx restorecp player 0 weapon gh
qlx restorecp player 0 ammo rl 10
qlx restorecp player 0 ammo lg 8
qlx restorecp player 0 ammo rg 5

qlx restorecp player 1 bot
qlx restorecp player 1 pos 1232 -1312 280
qlx restorecp player 1 hp 100
qlx restorecp player 1 armor 50
qlx restorecp player 1 score 1
