name: Tests

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      # Dummy, non-production value: with_app_context() calls create_app()
      # with no test_config override, which imports ui.config for real.
      # ProductionConfig's class body raises unconditionally (regardless of
      # FLASK_ENV) if SECRET_KEY is unset in the environment. Locally this is
      # masked by a real .env file; CI has none, so it's needed here.
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir "setuptools>=68.0.0,<81.0.0"
          pip install --no-cache-dir "ansible-core>=2.17,<2.18"
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest

      - name: Run tests
        run: pytest tests/

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test
