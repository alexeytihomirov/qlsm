---
- name: List QLDS Server-Side Demos
  hosts: all
  become: yes
  gather_facts: false

  vars:
    game_port: "{{ port }}"
    demo_dir: "/home/ql/qlds-{{ game_port }}/demos"

  tasks:
    - name: Initialize demo entry list
      ansible.builtin.set_fact:
        demo_entries: []

    - name: Check if demos directory exists
      ansible.builtin.stat:
        path: "{{ demo_dir }}"
      register: demo_dir_stat

    - name: Find demo files
      ansible.builtin.find:
        paths: "{{ demo_dir }}"
        patterns:
          - "*.dm_91"
          - "*.qlmatch"
        file_type: file
        recurse: false
      register: demo_find
      when: demo_dir_stat.stat.exists and demo_dir_stat.stat.isdir

    - name: Append safe demo entries (name/size/mtime)
      ansible.builtin.set_fact:
        demo_entries: "{{ demo_entries + [{'name': item.path | basename, 'size': item.size, 'mtime': item.mtime}] }}"
      loop: "{{ demo_find.files | default([]) }}"
      when:
        - demo_dir_stat.stat.exists and demo_dir_stat.stat.isdir
        - (item.path | basename) is match('^[A-Za-z0-9._-]+\\.(dm_91|qlmatch)\\Z')

    - name: Output demo entries to stdout for capture
      ansible.builtin.debug:
        msg: "{{ demo_entries | to_json }}"
