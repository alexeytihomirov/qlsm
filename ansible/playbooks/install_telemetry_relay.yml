---
# Manual maintenance playbook — not wired into the QLSM UI/task queue (same
# pattern as rebuild_minqlx.yml). One relay serves every QLDS instance on
# the host (it routes internally by server_id in each POST body), so this
# installs once per host, not once per instance.
#
# Run directly, e.g.:
#   ansible-playbook -i ansible/inventory/<host>.yml ansible/playbooks/install_telemetry_relay.yml
#
# After this runs, two things still need manual setup (deployment-specific,
# not something to guess a default for):
#   1. Edit /home/ql/telemetry-relay.json on the host — set "enabled": true,
#      the real ingest "token", and a "routes" entry per instance:
#        "routes": { "<server_id>": {
#          "telemetry": "https://<stats-hub>/api/ingest/telemetry",
#          "item_events": "https://<stats-hub>/api/ingest/item-events"
#        } }
#      then `systemctl reload ql-telemetry-relay` (relay.py reloads on SIGHUP,
#      matching the supervisor-based install's hub-Apply behavior).
#   2. Point each instance's stream_telemetry_unified.py at the local relay
#      and give it a matching server_id, e.g. in server.cfg (cvar names
#      verified against addons/telemetry/minqlx/stream_telemetry_unified.py
#      in ql-server-core — check that file if it's changed since this was written):
#        set qlx_statsHubUnifiedEnabled "1"   # master switch, off by default
#        set qlx_statsHubUrl "http://127.0.0.1:8190/api/ingest/telemetry"
#        set qlx_statsHubToken "local"
#        set qlx_statsHubServerId "<server_id — matches a routes/ key above>"

- name: Install ql-telemetry-relay (local HTTP forwarder, one per host)
  hosts: all
  become: yes
  gather_facts: false

  vars:
    telemetry_relay_dir: "/home/ql/telemetry-relay"
    telemetry_relay_config: "/home/ql/telemetry-relay.json"

  tasks:
    - name: Create telemetry-relay directory
      file:
        path: "{{ telemetry_relay_dir }}"
        state: directory
        owner: ql
        group: ql
        mode: '0755'

    - name: Copy relay.py to the host
      copy:
        src: "{{ playbook_dir }}/../../ql-assets/data/telemetry-relay/relay.py"
        dest: "{{ telemetry_relay_dir }}/relay.py"
        owner: ql
        group: ql
        mode: '0755'

    - name: Create default config if missing (disabled — operator fills in routes/token)
      copy:
        dest: "{{ telemetry_relay_config }}"
        owner: ql
        group: ql
        mode: '0600'
        force: no # Never overwrite an existing config — it holds the real token.
        content: |
          {
            "enabled": false,
            "token": "",
            "routes": {},
            "timeout_sec": 2
          }

    - name: Render ql-telemetry-relay systemd unit
      template:
        src: ../templates/ql-telemetry-relay.service.j2
        dest: /etc/systemd/system/ql-telemetry-relay.service
        owner: root
        group: root
        mode: '0644'
      notify: reload systemd and (re)start telemetry relay

    - name: Flush handlers so daemon_reload runs before enabling/starting
      meta: flush_handlers

    - name: Enable ql-telemetry-relay service
      ansible.builtin.systemd:
        name: ql-telemetry-relay
        enabled: yes

  handlers:
    - name: reload systemd and (re)start telemetry relay
      ansible.builtin.systemd:
        daemon_reload: yes
        name: ql-telemetry-relay
        state: restarted
