---
- name: Fetch QLDS Server Log Archive
  hosts: all
  become: yes
  gather_facts: false

  vars:
    game_port: "{{ port }}"
    log_mode: "{{ filter_mode | default('lines') }}"
    log_lines: "{{ lines | default(500) }}"
    log_filename: "{{ filename | default('server.log') }}"
    log_dir: "/home/ql/qlds-{{ game_port }}/serverlogs"
    log_file: "{{ log_dir }}/{{ log_filename }}"
    remote_tmp_file: "/tmp/qlsm-serverlog-{{ fetch_token }}.txt"

  tasks:
    # A controller-side timeout skips the removal task below, stranding the
    # extracted file. Sweep anything old enough to be orphaned rather than
    # relying on every run finishing cleanly.
    - name: Remove stale temp files from prior timed-out fetches
      ansible.builtin.command:
        cmd: find /tmp -maxdepth 1 -name 'qlsm-serverlog-*' -mmin +60 -delete
      changed_when: false
      failed_when: false

    # Reads can land on hosts provisioned before archiving existed, since
    # setup_server_log_archiving.yml only runs when invoked explicitly and
    # setup_host.yml only runs at initial provisioning. Self-provision here so
    # a stale host serves an archive read instead of "file not found".
    #
    # Gate on the timer unit, not the archive script: the script is the
    # *first* file tasks/server_log_archiving.yml deploys, so if provisioning
    # fails partway after the script lands, gating on the script would read
    # "already installed" and skip re-provisioning forever -- leaving the
    # host with no logrotate policy, i.e. unbounded log growth, the exact bug
    # this feature exists to fix. The timer unit is the last file deployed,
    # so its presence implies the script, logrotate policy, and service unit
    # all landed too.
    #
    # The unit file alone isn't enough: it's written at step 6 of 9, so a
    # daemon-reload or enable/start failure at steps 7-8 leaves the file
    # present with the timer never actually enabled -- silently inert, with
    # logrotate never invoked. Also check the enable symlink that
    # `systemctl enable` creates for WantedBy=timers.target, and require
    # both, so a partial provisioning failure re-provisions on the next read
    # instead of going silent.
    - name: Check whether server-log archiving is installed
      ansible.builtin.stat:
        path: /etc/systemd/system/qlsm-archive-serverlogs.timer
      register: archive_timer_stat

    - name: Check whether the archive timer is enabled
      ansible.builtin.stat:
        path: /etc/systemd/system/timers.target.wants/qlsm-archive-serverlogs.timer
      register: archive_timer_enabled_stat

    - name: Install server-log archiving if missing
      ansible.builtin.include_tasks: tasks/server_log_archiving.yml
      when: not archive_timer_stat.stat.exists or not archive_timer_enabled_stat.stat.exists

    # Flush pending journal entries so the current log is up to date at read
    # time rather than lagging the 5-minute archive timer. Only meaningful
    # for the live file: running this while an archive is requested risks a
    # logrotate rotation deleting the very archive being read mid-request.
    - name: Flush journal into the server log archive
      ansible.builtin.command:
        cmd: /usr/local/bin/qlsm-archive-serverlogs.sh
      when: log_filename == 'server.log'
      changed_when: false

    - name: Check if the requested server log file exists
      ansible.builtin.stat:
        path: "{{ log_file }}"
        get_checksum: no
      register: log_stat

    # set -o pipefail (and running under bash, since /bin/sh's pipefail
    # support varies) makes this task fail if cat/zcat dies mid-stream --
    # without it, tail's exit code alone determines success and a corrupt or
    # truncated source is indistinguishable from a clean read. The chmod
    # lets the fetch task below read the file without become.
    - name: Extract requested content into a temp file
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          {{ 'zcat' if log_filename.endswith('.gz') else 'cat' }} {{ log_file | quote }}
          {{ ('| tail -n ' ~ log_lines) if log_mode == 'lines' else '' }}
          > {{ remote_tmp_file | quote }} && chmod 0644 {{ remote_tmp_file | quote }}
        executable: /bin/bash
      when: log_stat.stat.exists
      register: extract_result
      changed_when: false

    # become: false here is load-bearing, not stylistic: ansible.builtin.fetch
    # only uses the fast checksum+SFTP path when the connection is not using
    # become (see fetch.py's "Don't bother if using become as slurp will be
    # used" guard) -- under become it silently falls back to slurping the
    # whole file through the module pipe as base64, ~1.33x the file size
    # in-band over SSH, which is exactly the transport cost this design
    # exists to avoid. The temp file is chmod 0644 above so the plain SSH
    # login user can read it without become.
    - name: Fetch the extracted content to the controller
      ansible.builtin.fetch:
        src: "{{ remote_tmp_file }}"
        dest: "{{ local_dest }}"
        flat: yes
      become: false
      when: log_stat.stat.exists

    - name: Remove the remote temp file
      ansible.builtin.file:
        path: "{{ remote_tmp_file }}"
        state: absent
