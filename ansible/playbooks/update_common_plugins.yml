---
# Narrow, on-demand refresh of the host-baseline minqlx plugin pool
# (/home/ql/assets/common/minqlx-plugins/) from ql-assets/data/minqlx-plugins/.
#
# setup_host.yml does the same sync, but it also touches network/firewall/
# hostname/SSH config — 66 unrelated tasks, too risky to run against a live
# host just to land a plugin fix. This playbook (mirroring the narrow
# force_update_workshop.yml pattern for workshop items) does only the plugin
# pool refresh, so the "Update Plugins" UI action doesn't require a full
# host re-setup.
#
# This only refreshes the host-local common pool; instances still pick the
# change up via their own restart (sync_instance_configs_and_restart.yml
# backfill, which compares by content — see docs/technical.md).

- name: Update Common minqlx Plugin Pool
  hosts: "{{ target_host | default('all') }}"
  become: yes
  gather_facts: false

  vars:
    common_assets_dir: "/home/ql/assets/common"

  tasks:
    - name: Ensure common minqlx-plugins directory exists
      ansible.builtin.file:
        path: "{{ common_assets_dir }}/minqlx-plugins"
        state: directory
        owner: ql
        group: ql
        mode: '0755'

    - ansible.builtin.import_tasks: tasks/sync_common_plugins.yml

    # The external .qlmatch packer rides along with plugin updates so a
    # packer fix reaches existing hosts through the same "Update Plugins"
    # action (it is launched by demo_native_autorecord.py from the pool
    # synced above, so the two must not drift apart).
    - ansible.builtin.import_tasks: tasks/sync_qlmatch_packer.yml
